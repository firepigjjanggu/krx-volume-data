# 미국 수집 + 브리핑 재생성. 2026-08-27 적용(MT-001 해소).
#
# make_brief 스텝을 지우면 CSV만 쌓이고 brief.json 이 멈춰 앱이 휴장 오표시를
# 낸다(INC-001). collect.yml 머리말 참조.
#
# 이전 정의 대비 달라진 점은 collect.yml과 동일하다
# (make_brief 스텝·버전 고정·액션 SHA 고정·토큰 최소화·잡 단위 권한).
name: 미국 거래량 스캔
on:
  schedule:
    - cron: '20 21 * * 1-5'   # 한국시간 화~토 새벽 6:20 (미국장 마감 후)
  workflow_dispatch:

permissions: {}

# 두 워크플로가 같은 그룹을 쓴다. data/brief.json 을 둘 다 새로 만들기 때문에
# 동시에 돌면 반드시 충돌한다. 큐에 세워 한 번에 하나만 쓰게 한다
# (cancel-in-progress: false — 취소하면 그날 수집분이 날아간다).
concurrency:
  group: krx-data-write
  cancel-in-progress: false

jobs:
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # 두 워크플로가 같은 requirements.txt를 쓴다 — 고정 버전의 단일 출처를 유지하기
      # 위해서다. KR 전용 패키지까지 함께 깔리지만(수십 초) 버전이 갈라지는 것보다 낫다.
      - run: pip install -r requirements.txt

      - run: python us_collect.py

      - name: 브리핑 생성
        id: brief
        continue-on-error: true
        run: python make_brief.py

      - name: 커밋
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "krx-bot"
          git config user.email "actions@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "us: $(date -u +%F)"
          LOCAL_SHA="$(git rev-parse HEAD)"

          # push 를 먼저 시도하고, 거부되면(원격이 앞섬) rebase 후 재시도한다.
          #
          # 예전 코드는 커밋 직후 `git pull --rebase ... || true` 를 했는데,
          # data/brief.json 은 두 워크플로가 모두 새로 만드는 생성물이라 겹치면
          # 반드시 충돌한다. `|| true` 가 그 실패를 삼키고 rebase 가 중단된 채로
          # 남으면 HEAD 가 원격 커밋과 같아져 다음 push 가 "Everything up-to-date"
          # 로 **성공**해 버린다. 그러면 fallback 도 안 돌고 잡은 초록불인데
          # 그날 데이터는 통째로 사라진다 — 2026-08-27 실제 발생(커밋 cc45054 소실,
          # data/20260827.csv 유실, published kr.date 가 하루 뒤처짐).
          pushed=0
          for attempt in 1 2 3; do
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "push 거부 — 원격이 앞섰다. rebase 후 재시도 ($attempt/3)"
            if ! git pull --rebase "$REMOTE" "${GITHUB_REF_NAME}"; then
              # 충돌 파일은 data/brief.json 하나뿐이다(둘 다 새로 만드는 생성물).
              # 어느 쪽을 골라도 곧 다시 만들 것이므로 일단 우리 쪽으로 진행만 시킨다
              # — rebase 중에는 replay 되는 우리 커밋이 "theirs".
              echo "rebase 충돌 — data/brief.json 은 아래에서 다시 만든다"
              git checkout --theirs -- data/brief.json || true
              git add -A data
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "rebase 를 복구하지 못했다" >&2
                exit 1
              fi
            fi

            # rebase 로 원격의 CSV 가 합쳐졌다. brief.json 은 **합쳐진 전체**를 보고
            # 다시 만들어야 한다. 안 그러면 오래된 CSV 집합으로 만든 brief 가 더
            # 신선한 것을 덮어쓴다 — 2026-08-27 실측: workflow_dispatch 는 요청 시점
            # SHA 에 고정되므로, 큐에서 기다리는 동안 다른 실행이 새 CSV 를 올려도
            # 이 잡의 체크아웃에는 없다. 그 상태로 만든 kr.date=08-26 짜리 brief 가
            # 08-27 짜리를 덮었다. make_brief 는 몇 초면 끝나므로 비용도 작다.
            # (자체점검이 실패하면 여기서 exit 1 — 잡이 실패로 끝난다)
            python make_brief.py
            git add -A data
            git diff --cached --quiet || git commit --amend --no-edit
            LOCAL_SHA="$(git rev-parse HEAD)"
          done

          if [ "$pushed" != "1" ]; then
            echo "3회 시도에도 push 하지 못했다" >&2
            exit 1
          fi

          # push 가 no-op 이 아니었는지 원격에서 직접 확인한다.
          # 이 확인이 없으면 위에 적은 "성공했는데 데이터가 없는" 사고를 못 잡는다.
          git fetch "$REMOTE" "${GITHUB_REF_NAME}"
          if ! git merge-base --is-ancestor "$LOCAL_SHA" FETCH_HEAD; then
            echo "push 는 성공으로 끝났으나 원격에 $LOCAL_SHA 이 없다 — 데이터 유실" >&2
            exit 1
          fi
          echo "push 확인 완료: $LOCAL_SHA 이 원격에 반영됨"

      - name: 브리핑 생성 실패 확인
        if: steps.brief.outcome == 'failure'
        run: |
          echo "make_brief.py 실패 — brief.json이 갱신되지 않았다. 로그를 확인할 것." >&2
          exit 1
