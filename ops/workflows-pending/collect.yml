# KRX 수집 + 브리핑 재생성. 2026-08-27 적용(MT-001 해소).
#
# 이 워크플로가 존재하는 이유: 예전에는 CSV만 쌓이고 data/brief.json 이 갱신되지
# 않아, 앱이 5일마다 실제 휴장이 아닌데도 "연휴/휴장" 화면으로 덮였다
# (INC-001, 2026-08-16~20 및 08-22~26 두 차례 실제 발생). make_brief 스텝이
# 여기 들어있는 것이 그 재발을 막는 핵심이다 — 지우지 말 것.
#
# 이전 정의 대비 달라진 점:
#   ① make_brief 실행 스텝 — CSV만 쌓이고 brief.json이 갱신되지 않던 문제 해소
#   ② pyarrow 설치 — make_brief가 marcap parquet을 읽는다
#   ③ 버전 고정(requirements.txt) — H-1 공급망 하드닝
#   ④ 액션을 커밋 SHA로 고정 — 태그는 옮겨 달릴 수 있다
#   ⑤ 체크아웃 시 토큰을 남기지 않고, 마지막 push에서만 명시적으로 사용
#   ⑥ permissions를 잡 단위로 축소
name: KRX 데이터 수집
on:
  schedule:
    - cron: '0 13 * * 1-5'   # 매주 월~금 밤 10시(한국시간)
  workflow_dispatch:

# H-1: 워크플로 전역이 아니라 잡 단위로 최소 권한만 준다.
permissions: {}

# 두 워크플로가 같은 그룹을 쓴다. data/brief.json 을 둘 다 새로 만들기 때문에
# 동시에 돌면 반드시 충돌한다. 큐에 세워 한 번에 하나만 쓰게 한다
# (cancel-in-progress: false — 취소하면 그날 수집분이 날아간다).
concurrency:
  group: krx-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # data/ 커밋·push에 필요한 유일한 권한
    steps:
      # H-1: 태그(@v4)는 같은 이름으로 다른 커밋을 가리키도록 바뀔 수 있으므로 SHA로 고정한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # H-1: 기본값(true)이면 토큰이 .git/config에 남아 이후 스텝에서 읽을 수 있다.
          # 이 워크플로는 서드파티 파이썬 패키지를 실행하므로, 그 코드가 도는 동안
          # 토큰을 두지 않는다. push는 마지막 스텝에서 토큰을 명시적으로 넘겨 수행한다.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # H-1: 버전을 고정해 설치한다. 값과 검증 상태는 requirements.txt 주석 참조.
      - run: pip install -r requirements.txt

      - run: python collect.py

      # 수집이 끝난 CSV로 브리핑을 다시 만든다. 실패해도 수집 결과는 커밋되도록
      # continue-on-error로 격리하고, 실패 사실은 마지막 스텝에서 잡 실패로 드러낸다.
      - name: 브리핑 생성
        id: brief
        continue-on-error: true
        run: python make_brief.py

      - name: 커밋
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "krx-bot"
          git config user.email "actions@users.noreply.github.com"
          # 토큰을 .git/config에 남기지 않으려고 remote를 고치지 않고 URL을 직접 넘긴다.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "auto: $(date -u +%F)"
          LOCAL_SHA="$(git rev-parse HEAD)"

          # push 를 먼저 시도하고, 거부되면(원격이 앞섬) rebase 후 재시도한다.
          #
          # 예전 코드는 커밋 직후 `git pull --rebase ... || true` 를 했는데,
          # data/brief.json 은 두 워크플로가 모두 새로 만드는 생성물이라 겹치면
          # 반드시 충돌한다. `|| true` 가 그 실패를 삼키고 rebase 가 중단된 채로
          # 남으면 HEAD 가 원격 커밋과 같아져 다음 push 가 "Everything up-to-date"
          # 로 **성공**해 버린다. 그러면 fallback 도 안 돌고 잡은 초록불인데
          # 그날 데이터는 통째로 사라진다 — 2026-08-27 실제 발생(커밋 cc45054 소실,
          # data/20260827.csv 유실, published kr.date 가 하루 뒤처짐).
          pushed=0
          for attempt in 1 2 3; do
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "push 거부 — 원격이 앞섰다. rebase 후 재시도 ($attempt/3)"
            if ! git pull --rebase "$REMOTE" "${GITHUB_REF_NAME}"; then
              # 충돌 파일은 data/brief.json 하나뿐이다(생성물). 이번 실행이 방금
              # 만든 쪽을 채택한다 — rebase 중에는 replay 되는 우리 커밋이 "theirs".
              echo "rebase 충돌 — 생성물 data/brief.json 은 이번 실행분을 채택한다"
              git checkout --theirs -- data/brief.json || true
              git add -A data
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "rebase 를 복구하지 못했다" >&2
                exit 1
              fi
            fi
            LOCAL_SHA="$(git rev-parse HEAD)"
          done

          if [ "$pushed" != "1" ]; then
            echo "3회 시도에도 push 하지 못했다" >&2
            exit 1
          fi

          # push 가 no-op 이 아니었는지 원격에서 직접 확인한다.
          # 이 확인이 없으면 위에 적은 "성공했는데 데이터가 없는" 사고를 못 잡는다.
          git fetch "$REMOTE" "${GITHUB_REF_NAME}"
          if ! git merge-base --is-ancestor "$LOCAL_SHA" FETCH_HEAD; then
            echo "push 는 성공으로 끝났으나 원격에 $LOCAL_SHA 이 없다 — 데이터 유실" >&2
            exit 1
          fi
          echo "push 확인 완료: $LOCAL_SHA 이 원격에 반영됨"

      # 브리핑 생성이 조용히 실패하면 CSV만 쌓이는 상태가 재발한다 — 잡을 실패로 만든다.
      - name: 브리핑 생성 실패 확인
        if: steps.brief.outcome == 'failure'
        run: |
          echo "make_brief.py 실패 — brief.json이 갱신되지 않았다. 로그를 확인할 것." >&2
          exit 1
