
name: KRX 데이터 수집
on:
  schedule:
    - cron: '0 10 * * 1-5'   # 매주 월~금 저녁 7시(한국시간)
  workflow_dispatch:          # 수동 실행 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pykrx pandas
      - run: python collect.py
      - name: 커밋
        run: |
          git config user.name "krx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "auto: $(TZ=Asia/Seoul date +%F)"
          git push
